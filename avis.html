<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet"><title>قولنا رأيك | ELBAS WE7DK</title><meta name="robots" content="noindex"><style>:root{--y:#FFCC4D;--bg:#070707;--card:#111;--line:#2a2a2a;--dim:#9a9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f4;font-family:Cairo,sans-serif;line-height:1.65}.w{max-width:600px;margin:auto;padding:20px 16px 150px}.lg{height:44px;display:block}a{color:var(--y)}h1{font-size:26px;margin:16px 0 6px;line-height:1.3}p.s{color:var(--dim);margin:0 0 14px}.b{display:block;text-align:center;text-decoration:none;background:var(--y);color:#070707;font-weight:900;font-size:18px;padding:14px;border-radius:14px;margin-top:12px}.b.o{background:transparent;color:var(--y);border:2px solid var(--y)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:26px}</style><style>.lb{font-weight:700;margin:16px 0 6px}input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font:600 16px Cairo,sans-serif}.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-end}.stars button{font-size:38px;background:none;border:0;color:#444;cursor:pointer;padding:0 2px}.stars button.on{color:var(--y)}.ck{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:#ccc}.ck input{width:20px;height:20px;flex:0 0 auto}button.b{width:100%;border:0;cursor:pointer;font-family:Cairo,sans-serif}button.b:disabled{opacity:.6}#ok{display:none}.err{color:#ff8a80;min-height:1px;margin-top:8px}</style><script src="https://js-de.sentry-cdn.com/a6d9096d93e883224d0adf14ecc1f693.min.js" crossorigin="anonymous"></script></head><body><div class="w"><a href="/"><img class="lg" src="/logo.png" alt="ELBAS WE7DK"></a><div id="fm"><h1>⭐ قولنا رأيك</h1><p class="s">وصلك الهودي؟ رأيك يعاونا نتحسنو ويعاون الناس يختارو 🙏</p><div class="lb">شحال تعطينا؟</div><div class="stars" id="st"><button type="button" data-v="1" aria-label="1">★</button><button type="button" data-v="2" aria-label="2">★</button><button type="button" data-v="3" aria-label="3">★</button><button type="button" data-v="4" aria-label="4">★</button><button type="button" data-v="5" aria-label="5">★</button></div><div class="lb">الموديل اللي شريت</div><select id="pr"><option value="">اختار الموديل</option></select><div class="lb">رأيك</div><textarea id="c" maxlength="300" rows="3" placeholder="القماش، الطباعة، المقاس، التوصيل..."></textarea><div class="lb">اسمك (الاسم الأول برك)</div><input id="n" maxlength="20" placeholder="مثال: أمين"><div class="lb">الولاية (اختياري)</div><input id="wl" maxlength="20" placeholder="مثال: عنابة"><label class="ck"><input type="checkbox" id="ok1" checked><span>نقبل رأيي يتنشر في السيت (بالاسم الأول والولاية برك).</span></label><div class="err" id="er" role="alert"></div><button class="b" id="go" type="button">ابعث رأيي</button></div><div id="ok"><h1 style="color:var(--y)">🖤 يعطيك الصحة!</h1><p class="s">وصلنا رأيك. إذا عندك تصويرة بالهودي، ابعثهالنا في Instagram ونفرحو بيها.</p><a class="b" href="https://www.instagram.com/elbas_we7dk/" target="_blank" rel="noopener">ابعث التصويرة في Instagram</a><a class="b o" href="/">رجع للمتجر</a></div></div><script>const $=s=>document.querySelector(s);let S=0;document.querySelectorAll("#st button").forEach(b=>b.onclick=()=>{S=+b.dataset.v;document.querySelectorAll("#st button").forEach(x=>x.classList.toggle("on",+x.dataset.v<=S))});fetch("/produits.json").then(r=>r.json()).then(j=>{$("#pr").insertAdjacentHTML("beforeend",(j.produits||[]).map(p=>`<option value="${p.id}">${p.nom.replace(/</g,"")}</option>`).join(""))}).catch(()=>{});$("#go").onclick=async()=>{if(!S)return $("#er").textContent="اختار شحال من نجمة";if($("#c").value.trim().length<3)return $("#er").textContent="اكتب رأيك (ولو كلمتين)";$("#er").textContent="";$("#go").disabled=true;try{const x=await fetch("https://ew-ig-bot.sanchezchemsou.workers.dev/api/avis",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({s:S,p:$("#pr").value,c:$("#c").value.slice(0,300),n:$("#n").value.slice(0,20),w:$("#wl").value.slice(0,20),pub:$("#ok1").checked}),signal:AbortSignal.timeout(20000)});if(!x.ok&&x.status!==429)throw 0;$("#fm").style.display="none";$("#ok").style.display="block";scrollTo(0,0)}catch(e){$("#er").textContent="ما قدرناش نبعثو. عاود بعد شوية.";$("#go").disabled=false}};</script></body></html>
