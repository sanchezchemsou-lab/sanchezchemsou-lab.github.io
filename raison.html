<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet"><title>علاش رجع الطرد؟ | ELBAS WE7DK</title><meta name="robots" content="noindex"><style>:root{--y:#FFCC4D;--bg:#070707;--card:#111;--line:#2a2a2a;--dim:#9a9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f4;font-family:Readex Pro,Cairo,sans-serif;line-height:1.65}.w{max-width:600px;margin:auto;padding:20px 16px 150px}.lg{height:44px;display:block}a{color:var(--y)}h1{font-size:26px;margin:16px 0 6px;line-height:1.3}p.s{color:var(--dim);margin:0 0 14px}.b{display:block;text-align:center;text-decoration:none;background:var(--y);color:#070707;font-weight:600;font-size:18px;padding:14px;border-radius:14px;margin-top:12px}.b.o{background:transparent;color:var(--y);border:2px solid var(--y)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:26px}</style><style>.op{display:flex;flex-wrap:wrap;gap:8px}.op label{display:inline-flex}.op input{position:absolute;opacity:0;pointer-events:none}.op span{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:500;cursor:pointer}.op input:checked+span{background:var(--y);color:#070707;border-color:var(--y)}.op input:focus-visible+span{outline:2px solid var(--y)}.lb{font-weight:500;margin:16px 0 6px}textarea,input[type=tel]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font:600 16px Readex Pro,Cairo,sans-serif}button.b{width:100%;border:0;cursor:pointer;font-family:Readex Pro,Cairo,sans-serif}button.b:disabled{opacity:.6}#ok{display:none}.err{color:#ff8a80;min-height:1px;margin-top:8px}</style><script src="https://js-de.sentry-cdn.com/a6d9096d93e883224d0adf14ecc1f693.min.js" crossorigin="anonymous"></script></head><body><div class="w"><a href="/"><img class="lg" src="/logo.png" alt="ELBAS WE7DK"></a><div id="fm"><h1>علاش رجع الطرد؟</h1><p class="s">سؤال واحد، 10 ثواني. ما نلوموكش، نحبو نفهمو باش نتحسنو</p><div class="lb">السبب</div><div class="op" id="r"><label><input type="radio" name="r" value="0"><span>المقاس صغير عليا</span></label><label><input type="radio" name="r" value="1"><span>المقاس كبير عليا</span></label><label><input type="radio" name="r" value="2"><span>ما كنتش موجود كي جا الليفرور</span></label><label><input type="radio" name="r" value="3"><span>ما كانش عندي الدراهم ساعتها</span></label><label><input type="radio" name="r" value="4"><span>التوصيل طوّل بزاف</span></label><label><input type="radio" name="r" value="5"><span>الموديل ماشي كيما في التصويرة</span></label><label><input type="radio" name="r" value="6"><span>بدّلت رايي</span></label><label><input type="radio" name="r" value="7"><span>سبب آخر</span></label></div><div class="lb">المقاس اللي طلبت</div><div class="op"><label><input type="radio" name="t" value="S"><span>S</span></label><label><input type="radio" name="t" value="M"><span>M</span></label><label><input type="radio" name="t" value="L"><span>L</span></label><label><input type="radio" name="t" value="XL"><span>XL</span></label><label><input type="radio" name="t" value="?"><span>ما نعرفش</span></label></div><div class="lb">كلمة زايدة (اختياري)</div><textarea id="c" maxlength="300" placeholder="واش نقدرو نديرو خير؟"></textarea><div class="lb">رقم التيليفون (اختياري، إذا تحب نعاودو نبعثوهولك)</div><input id="ph" type="tel" inputmode="numeric" maxlength="20" dir="ltr" style="text-align:right" placeholder="0555 12 34 56"><label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:500"><input type="checkbox" id="rs" style="width:22px;height:22px"> مازلت حاب الطلبية: عاودو ابعثوهالي</label><div class="err" id="er" role="alert"></div><button class="b" id="go" type="button">ابعث</button></div><div id="ok"><h1 style="color:var(--y)">يعطيك الصحة!</h1><p class="s">وصلنا جوابك. إذا مازلت حاب الطلبية، ابعثلنا في Instagram ونعاودو نبعثوهالك.</p><a class="b" href="https://www.instagram.com/elbas_we7dk/" target="_blank" rel="noopener">ابعثلنا في Instagram</a><a class="b o" href="/">رجع للمتجر</a></div></div><script>const $=s=>document.querySelector(s),v=n=>{const e=document.querySelector("input[name="+n+"]:checked");return e?e.value:""};$("#go").onclick=async()=>{const r=v("r");if(r===""){$("#er").textContent="اختار السبب";return}if($("#rs").checked&&$("#ph").value.replace(/\D/g,"").length<9){$("#er").textContent="باش نعاودو نبعثوهالك، اكتب رقم التيليفون";return}$("#er").textContent="";$("#go").disabled=true;try{const x=await fetch("https://ew-ig-bot.sanchezchemsou.workers.dev/api/raison",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({r:+r,t:v("t"),c:$("#c").value.slice(0,300),tel:$("#ph").value.slice(0,20),renvoi:$("#rs").checked}),signal:AbortSignal.timeout(20000)});if(!x.ok&&x.status!==429)throw 0;$("#fm").style.display="none";$("#ok").style.display="block";scrollTo(0,0)}catch(e){$("#er").textContent="ما قدرناش نبعثو. عاود بعد شوية.";$("#go").disabled=false}};</script><!--unslop--><style id="unslop">
